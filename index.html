<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=search" />
</head>
<body>
    <div class="container">
        <header>
        <div class="logo"><img src="/img/swiggy_logo_white.avif" alt=""></div>
        <nav>
            <ul>
                <li>Swiggy Corporate</li>
                <li>Partner with us</li>
               
            </ul>
            <div>
                <button class="curv">Get the App</button>
                <button class="curv" id="black" >Sign in</button>
            </div>
        </nav>
    </header>
    </div>
    <div class="mid-div">
        <img class="left-img" src="/img/Veggies_new.avif" alt="">
        <div class="middle-txt">
            Order food & groceries. Discover best restaurants. Swiggy it!
        </div>
        <form class="mid-buttons">
            <div class="location-div">
                <span class="loc-material-symbols-outlined">location</span>
                <input class="location" type="text" placeholder="Enter your delivery location">
            </div>
            <div class="search-div">
                <button class="Search-bt" type="submit" >Search for restaurant, item or more </button>
                <span class="search-material-symbols-outlined">search</span> 
            </div>
        </form>
        <img class="right-img" src="/img/Sushi_replace.avif" alt="">
    </div>
 
</body>
</html>
